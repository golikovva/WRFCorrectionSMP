stages:
  - name: train_nestp_from_scratch_1wps
    init_weights_from: none
    overrides:
      global_seed: 137
      split_config:
        start_date: '2019-01-01'
        end_date: '2020-12-31'
        split_mode: seasonal_nested
        test_years: '2020'
        blocks_per_season: 1
        block_size: '7D'
        seed: 42
        validation_blocks_per_season: 1
        validation_block_size: '14D'
        validation_seed: 42
        require_complete_blocks: true
      reference_region: nestp
      reference_dataset: WRF
      target_dataset: ERA5
      run_config:
        run_mode: train
        batch_size: 2
      test_config:
        regional_metrics:
          enabled: true
